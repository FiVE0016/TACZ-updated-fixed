plugins {
    id 'net.minecraftforge.gradle'
    id 'com.gradleup.shadow'
}

sourceSets.main {
    java.srcDir project(':common').file('src/main/java')
    resources.srcDir project(':common').file('src/main/resources')
}

def mixinConfigs = ['tacz.mixins.json', 'tacz.hooks.mixins.json', 'tacz.iris.mixins.json', 'tacz.voxy.mixins.json', 'tacz.mesh.mixins.json', 'tacz.carryon.mixins.json', 'lrtactical.mixins.json']

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            mixinConfigs.each { args "--mixin.config=${it}" }
            jvmArgs '-Xmx4G'
        }
        register('client')
        register('server') {
            workingDir = layout.projectDirectory.dir('run-server')
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
}

jar {
    manifest {
        attributes 'MixinConfigs': mixinConfigs.join(',')
    }
}

// Keep classes beside metadata for Forge's module discovery in development. The root Java
// configuration precedes ForgeGradle, so merge outputs explicitly; otherwise an incremental
// processResources run can delete compiled classes.
tasks.named('compileJava') { destinationDirectory = layout.buildDirectory.dir('classes/java/main') }
tasks.named('processResources') {
    dependsOn tasks.named('compileJava')
    from(tasks.named('compileJava').flatMap { it.destinationDirectory })
}
tasks.withType(Jar).configureEach { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

shadowJar {
    configurations = [project.configurations.bundle]
    archiveClassifier = ''
    rootProject.bundledRelocations.each { from, to -> relocate from, to }
    rootProject.bundledExclusions.each { exclude it }
    exclude 'META-INF/maven/**', 'META-INF/services/javax.script.*', 'META-INF/*.SF', 'META-INF/*.DSA',
            'META-INF/*.RSA', 'module-info.class', 'META-INF/versions/*/module-info.class'
    manifest {
        attributes 'MixinConfigs': mixinConfigs.join(',')
    }
}
jar { archiveClassifier = 'slim' }
assemble.dependsOn shadowJar
