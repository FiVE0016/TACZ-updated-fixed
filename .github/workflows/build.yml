name: build

# WHY THIS EXISTS
# This repository had no automated check at all. The consequence was concrete: the `forge`
# module is skipped by default (forge_enabled=false), so "four loaders" was really three, and
# nothing would have told anyone if a fourth silently rotted.
#
# This workflow answers two questions on every push:
#   1. Does the project still compile?
#   2. Does the release jar still avoid the LuaJ capabilities that were deliberately removed?
#      Gun packs are downloadable content and may contain Lua scripts. ScriptManager installs
#      no io/os/luajava library, and the bundled LuaJ has the classes behind them physically
#      stripped. If a later change re-introduces them, this workflow fails.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft 26.x requires Java 25, and settings.gradle throws if the Gradle JVM is older
      # than 25, so both Gradle and the build need it.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      # NOT --offline: a fresh runner has empty caches and must be allowed to download.
      # Forge is skipped because forge_enabled=false in gradle.properties. If that is ever
      # flipped to true this step needs maven.minecraftforge.net reachable and takes much longer.
      - name: Build
        run: ./gradlew build --console=plain --stacktrace

      - name: List produced jars
        run: ls -lh build/libs

      # The guard rail. Read-only: it inspects the jar, it never rewrites it.
      - name: Verify the release jar still excludes the dangerous LuaJ classes
        run: python3 scripts/verify_jar_exclusions.py

      - name: Upload jars (for manual in-game testing)
        uses: actions/upload-artifact@v4
        with:
          name: tacz-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
