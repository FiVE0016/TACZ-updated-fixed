org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8 -Dstdout.encoding=GBK -Dstderr.encoding=GBK
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.workers.max=4

# Gradle must run on JDK 25 (Minecraft 26.x requirement, enforced in settings.gradle).
#
# DO NOT hard-code a machine-specific JDK path here: it makes the project unbuildable for
# everyone else (C:/Program Files/Microsoft/jdk-25.0.3.9-hotspot/ only exists on the machine
# that wrote it). Let JAVA_HOME / PATH decide instead, or pass it per build:
#   ./gradlew build -Dorg.gradle.java.home="C:/path/to/jdk-25"
#
# Uncomment the line below ONLY if this machine's default JDK is not 25 and you would rather
# pin it here than set JAVA_HOME:
# org.gradle.java.home=C:/Program Files/Microsoft/jdk-25.0.3.9-hotspot/

# ---------------------------------------------------------------------------
# Proxy (MACHINE-SPECIFIC — leave commented out in the committed file)
#
# On this machine maven.neoforged.net is unreachable without a local proxy, while the other
# repositories (Fabric, Modrinth, Shedaniel, BlameJared, Maven Central) work directly.
# Do NOT commit these lines uncommented: nobody else has a proxy on 127.0.0.1:7897 and the
# build would fail for them. Either uncomment locally, or pass them per build:
#   ./gradlew build -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7897 \
#                   -Dhttp.proxyHost=127.0.0.1  -Dhttp.proxyPort=7897
# ---------------------------------------------------------------------------
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897

# ForgeGradle 7: keep classes and resources in one output folder for Forge's dev-time module discovery.
net.minecraftforge.gradle.merge-source-sets=true

# Mod
mod_id=tacz
mod_name=Timeless and Classics Guns: Zero
# Keep 1.1.8 as the version core: gun packs declare "tacz" version requirements against it.
# Loader/platform identity lives in the '+' build metadata, which version comparisons ignore.
mod_version=1.1.8+mc26.3
maven_group=com.tacz
mod_license=GPL-3.0-only (code) / CC BY-NC-ND 4.0 (assets)

# Minecraft
minecraft_version=26.3

# Fabric / Quilt
fabric_loader_version=0.19.5
# NOTE (2026-10-10): the maintainer's test instance runs Fabric API 0.162.0+26.3, while this
# build compiles against 0.160.7+26.3. Do NOT bump this just to match: on this machine every
# new pin means a fresh download through a proxy, which makes the local build slow or abort.
# The mismatch is harmless (Fabric API is compile-only and backward compatible) — the honest
# place to record it is HANDOFF.md, not a build-breaking version bump.
fabric_api_version=0.160.7+26.3
quilt_loader_version=0.31.0-beta.4

# NeoForge
# 26.3 is beta-only (63 beta builds exist, no stable yet). This is a PIN, not a minimum:
#   - 26.3.0.5 .. 26.3.0.7  are the builds that still use ModConfig.Type.COMMON/SERVER
#   - 26.3.0.51-beta and later ship FML 12.0.8, which REMOVED those two constants
# A jar compiled against .4 crashes on .51+ with NoSuchFieldError, and a jar compiled against
# .51+ cannot use the old config API. Upstream hit exactly this on 2026-10-05 and re-pinned.
#
# WHY THIS IS STILL .4-beta AND NOT .51-beta (2026-10-10):
#   .4-beta is the only version present in this machine's Gradle cache
#   (~/.gradle/caches/modules-2/files-2.1/net.neoforged/neoforge). Moving the pin to .51-beta
#   forces Gradle to download a new NeoForge + FML + neoform toolchain through a proxy, which
#   on this machine means a very long or aborted build. The bump to .51-beta is a known,
#   wanted change — do it on a machine with direct access to maven.neoforged.net, then re-test
#   the client, then update this comment.
neoforge_version=26.3.0.4-beta

# Forge
# Set forge_enabled=false to drop the forge module from the build (settings.gradle honours it),
# e.g. while waiting for Forge to release for a new Minecraft version.
forge_enabled=false
forge_version=26.3-66.0.2

# Optional integrations (compile-only)
# NOTE (2026-10-10): the test instance runs Cloth Config 26.3.159 and PAL 1.2.8, while this
# build compiles against 26.3.158 / 1.2.7. Left as-is on purpose — see the note above
# fabric_api_version. Bumping either forces a proxy download and buys nothing: these are
# compile-only and never ship. Recorded in HANDOFF.md instead.
cloth_config_version=26.3.158
jei_version=31.0.0.5
# Modrinth version ids. player_animation_lib: kemJXVHZ = 1.2.7+26.3 (xJ30QmpE would be 1.2.8+26.3).
# Shoulder Surfing Reloaded has no 26.3 build; the 26.2 jar is kept for its compile-time plugin API only.
player_animation_lib_version_id=kemJXVHZ
shoulder_surfing_version_id=xF3YjhUq
modmenu_version=21.0.0-beta.1
# REI: common API for common code, NeoForge API for plugin discovery there.
# REI has no 26.3 build; the 26.2 API jar is compile-only and never ships.
rei_version=26.2.821
# Architectury (compile-only: REI's API signatures reference its FluidStack)
architectury_version=13.0.11

# Bundled (shaded + relocated) libraries
luaj_version=3.0.8-figura
commons_math3_version=3.6.1
mae_version=1.1.1
