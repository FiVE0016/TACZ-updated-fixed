org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8 -Dstdout.encoding=GBK -Dstderr.encoding=GBK
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.workers.max=4

# Gradle must run on JDK 25 (Minecraft 26.x requirement, enforced in settings.gradle).
# Pinned to the local JDK 25 so `gradlew` works regardless of the default JAVA_HOME.
# Remove or repoint this line if the JDK moves or the project is built elsewhere.
org.gradle.java.home=C:/Program Files/Microsoft/jdk-25.0.3.9-hotspot/

# ForgeGradle 7: keep classes and resources in one output folder for Forge's dev-time module discovery.
net.minecraftforge.gradle.merge-source-sets=true

# Mod
mod_id=tacz
mod_name=Timeless and Classics Guns: Zero
# Keep 1.1.8 as the version core: gun packs declare "tacz" version requirements against it.
# Loader/platform identity lives in the '+' build metadata, which version comparisons ignore.
mod_version=1.1.8+mc26.3
maven_group=com.tacz
mod_license=GPL-3.0-only (code) / CC BY-NC-ND 4.0 (assets)

# Minecraft
minecraft_version=26.3

# Fabric / Quilt
fabric_loader_version=0.19.5
fabric_api_version=0.160.7+26.3
quilt_loader_version=0.31.0-beta.4

# NeoForge
# 26.3 has only beta builds so far; this is the newest of them.
neoforge_version=26.3.0.4-beta

# Forge
# Set forge_enabled=false to drop the forge module from the build (settings.gradle honours it),
# e.g. while waiting for Forge to release for a new Minecraft version.
forge_enabled=false
forge_version=26.3-66.0.2

# Optional integrations (compile-only)
cloth_config_version=26.3.158
jei_version=31.0.0.5
# Modrinth version ids: PlayerAnimationLib 1.2.7 (merged jar).
# Shoulder Surfing Reloaded has no 26.3 build; the 26.2 jar is kept for its compile-time plugin API only.
player_animation_lib_version_id=kemJXVHZ
shoulder_surfing_version_id=xF3YjhUq
modmenu_version=21.0.0-beta.1
# REI: common API for common code, NeoForge API for plugin discovery there.
# REI has no 26.3 build; the 26.2 API jar is compile-only and never ships.
rei_version=26.2.821
# Architectury (compile-only: REI's API signatures reference its FluidStack)
architectury_version=13.0.11

# Bundled (shaded + relocated) libraries
luaj_version=3.0.8-figura
commons_math3_version=3.6.1
mae_version=1.1.1
